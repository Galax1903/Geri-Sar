<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geri Sar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .countdown-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .countdown-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: #818cf8;
            text-transform: uppercase;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 16px;
            min-width: 90px;
            padding: 1rem;
        }

        .time-num {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .separator {
            font-size: 2.5rem;
            font-weight: 600;
            color: #475569;
            align-self: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            
       
            <div class="countdown-card">
                <h1 class="countdown-title mb-4">GERİ SAR'ın Verdiği Süre</h1>
                
               
                <div class="d-flex justify-content-center gap-2 gap-sm-3 my-4" id="countdown-container">
                    
                    <!-- Saat -->
                    <div class="time-box">
                        <div class="time-num" id="hours">14</div>
                        <div class="time-label">Saat</div>
                    </div>
                    
                    <div class="separator">:</div>
                    
                    <!-- Dakika -->
                    <div class="time-box">
                        <div class="time-num" id="minutes">00</div>
                        <div class="time-label">Dakika</div>
                    </div>
                    
                    <div class="separator">:</div>
                    
                    <!-- Saniye -->
                    <div class="time-box">
                        <div class="time-num" id="seconds">00</div>
                        <div class="time-label">Saniye</div>
                    </div>
                    
                </div>

                <!-- Süre Bittiğinde Görünecek Mesaj (Başlangıçta Gizli) -->
                <div id="expiry-message" class="alert alert-danger d-none fs-4 fw-bold rounded-3" role="alert">
                    Süre Doldu!
                </div>

            </div>
            
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>

    const targetTime = new Date().getTime() + (14 * 60 * 60 * 1000);

    const countdownInterval = setInterval(function() {
        const now = new Date().getTime();
        const difference = targetTime - now;

      
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

     
        document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
        document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
        document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

        
        if (difference < 0) {
            clearInterval(countdownInterval);
            document.getElementById("countdown-container").classList.add("d-none");
            document.getElementById("expiry-message").classList.remove("d-none");
        }
    }, 1000);
</script>

</body>
</html>
